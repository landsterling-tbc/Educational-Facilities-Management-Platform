name: Sync TFMP Work Orders

on:
  # من الأحد للخميس، 3 مرات يوميًا: 8ص و11ص و2م بتوقيت السعودية (5,8,11 UTC)
  schedule:
    - cron: '0 5,8,11 * * 0-4'
  # زر "Run workflow" للتشغيل اليدوي
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tfmp-work-orders
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت مكتبة قراءة xlsx
        run: npm install xlsx --no-save

      - name: سحب تصدير أوامر الشغل من TFMP
        env:
          TFMP_USERNAME: ${{ secrets.TFMP_USERNAME }}
          TFMP_PASSWORD: ${{ secrets.TFMP_PASSWORD }}
        run: node scripts/sync-tfmp-work-orders.js

      - name: حفظ ورفع النتيجة
        run: |
          git config user.name "tfmp-bot"
          git config user.email "actions@github.com"
          git add -A -- data/tfmp/work_orders
          if git diff --staged --quiet; then
            echo "لا توجد بيانات جديدة"
            exit 0
          fi
          git commit -q -m "تحديث تلقائي: أوامر الشغل والفحوصات من TFMP"
          for i in 1 2 3; do
            if git push -q; then echo "✔ تم الرفع"; break; fi
            git pull --rebase -q
            sleep 5
          done
