<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>لوحة المعلومات</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#081e2a 0%,#163d52 100%);color:#fff}
  .screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .box{text-align:center;max-width:92vw;width:100%}
  .title{font-size:30px;font-weight:900;margin-bottom:8px;letter-spacing:.5px}
  .sub{font-size:13px;color:rgba(255,255,255,.65);margin-bottom:32px;line-height:1.8}
  .options{display:flex;align-items:stretch;justify-content:center;gap:22px;flex-wrap:wrap}
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:28px 40px;display:flex;align-items:center;justify-content:center;min-width:180px;min-height:90px;cursor:pointer;transition:background .2s,border-color .2s,transform .2s;font:inherit;color:inherit}
  .card:hover,.card:focus-visible{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);transform:translateY(-2px);outline:none}
  .card img{max-height:42px;max-width:160px;filter:brightness(0) invert(1);opacity:.95;display:block}
  form{display:flex;flex-direction:column;align-items:center;width:100%;max-width:280px;margin:0 auto}
  input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.24);border-radius:10px;padding:12px 16px;font-size:15px;font-family:inherit;color:#fff;text-align:center;letter-spacing:2px;outline:none;transition:border-color .2s,background .2s}
  input::placeholder{color:rgba(255,255,255,.4);letter-spacing:normal}
  input:focus{border-color:#d4af6a;background:rgba(255,255,255,.12)}
  input.bad{border-color:#e05252!important;animation:shake .32s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .err{color:#ff9d9d;font-size:13px;margin-top:10px;min-height:20px;line-height:1.7}
  .actions{display:flex;gap:10px;margin-top:14px;width:100%}
  .btn{flex:1;border:none;border-radius:10px;padding:11px 14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s,opacity .15s}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.55;cursor:wait}
  .primary{background:linear-gradient(135deg,#b08a4e,#d4af6a);color:#1a1207}
  .secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85)}
  .retry{display:inline-block;margin-top:16px;border:none;border-radius:10px;padding:10px 26px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#b08a4e,#d4af6a);color:#1a1207}
  .spin.stop{animation:none;border-top-color:rgba(255,255,255,.18);opacity:.6}
  .spin{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#d4af6a;margin:0 auto 18px;animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  [hidden]{display:none!important}
  @media (max-width:480px){.title{font-size:24px}.card{padding:22px 26px;min-width:140px}.card img{max-height:34px;max-width:130px}}
</style>
</head>
<body>
<div class="screen" id="sBusy">
  <div class="box"><div class="spin" aria-hidden="true"></div><div class="sub" id="busyTxt">جاري التحميل…</div><button type="button" class="retry" id="btnRetry" hidden>إعادة المحاولة</button></div>
</div>

<div class="screen" id="sBrand" hidden>
  <div class="box">
    <div class="title">اختر</div>
    <div class="sub">اختر الشعار للدخول إلى لوحة البيانات</div>
    <div class="options">
      <button type="button" class="card" data-brand="landsterling" aria-label="Land Sterling">
        <img src="https://landsterling.sa/wp-content/uploads/2024/08/LS-Logo-White-English.png" alt="Land Sterling">
      </button>
      <button type="button" class="card" data-brand="tbc" aria-label="TBC">
        <img src="https://tbc.sa/Portals/0/tbcnew-01.svg?ver=2019-08-07-114519-183" alt="TBC">
      </button>
    </div>
  </div>
</div>

<div class="screen" id="sPw" hidden>
  <div class="box">
    <div class="title">كلمة المرور</div>
    <div class="sub" id="pwSub"></div>
    <form id="pwForm" autocomplete="off" novalidate>
      <input type="password" id="pw" placeholder="كلمة المرور" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="كلمة المرور">
      <div class="err" id="pwErr" role="alert"></div>
      <div class="actions">
        <button type="button" class="btn secondary" id="pwBack">رجوع</button>
        <button type="submit" class="btn primary" id="pwGo">دخول</button>
      </div>
    </form>
  </div>
</div>
